# Portable Security Audit - default configuration.
#
# Do not edit this file on the USB drive (it is covered by the integrity
# manifest). Put overrides in config/local.toml instead; any key omitted
# there keeps the value below. Values outside safe bounds are clamped and a
# warning is logged.

[general]
# Never contact external services. Turning this off only permits
# operator-initiated vulnerability-data updates (Phase 5); assessment data
# is never uploaded anywhere.
offline_mode = true
# Empty = <USB root>/reports. Set this if the USB drive is read-only.
output_dir = ""

[execution]
command_timeout_seconds = 30       # per external command (max 600)
check_timeout_seconds = 120        # per check (max 3600)
max_output_bytes = 2000000         # captured stdout/stderr per command

[network]
# Applies to Module D (controlled network assessment, Phase 4).
max_hosts_per_target = 256         # a /24; hard ceiling 1024
max_total_hosts = 256              # across the whole authorized scope; hard ceiling 1024
max_ports = 1024                   # hard ceiling 4096
default_ports = "21,22,23,25,53,80,110,135,139,143,389,443,445,636,1433,1521,3306,3389,5432,5900,5985,5986,8080,8443"
connect_timeout_seconds = 1.5      # 0.1 - 30
max_concurrency = 16               # 1 - 64
rate_limit_per_second = 50         # connection attempts per second, 1 - 200
require_dry_run_preview = true     # show the scan plan before any traffic is sent

[reporting]
formats = ["json"]                 # Phase 6 adds "html", "pdf", "csv"
include_raw_evidence = true        # evidence is always redacted

[logging]
level = "INFO"                     # DEBUG, INFO, WARNING, ERROR
