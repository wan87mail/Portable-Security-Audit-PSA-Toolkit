name: test-and-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022, windows-2025]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      # On Windows this includes test_read_only, which runs a real (read-only) local audit
      # through PowerShell and verifies every started process against the command policy.
      - name: Tests (Linux, with virtual display for the GUI test)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -rs --durations=15
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -rs --durations=15
      - name: Live read-only audit of the runner (evidence of real-OS behaviour)
        shell: bash
        run: |
          mkdir -p ci-reports
          PYTHONPATH=src python -m psatoolkit info
          PYTHONPATH=src python -m psatoolkit audit --operator "CI" --reference "GitHub Actions run ${{ github.run_id }}" \
            --confirm "I AM AUTHORIZED" --output ci-reports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: live-audit-${{ matrix.os }}-py${{ matrix.python }}
          path: ci-reports/
          retention-days: 14

  build-windows:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build PortableSecurityAudit.exe
        shell: pwsh
        run: ./packaging/build_windows.ps1 -SkipTests -PythonExe (Get-Command python).Source
      - name: Self-test the frozen executable (GUI must be bundled)
        run: dist\windows\PortableSecurityAudit\PortableSecurityAudit.exe selftest --require-gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PortableSecurityAudit-windows
          path: dist/windows/PortableSecurityAudit/
          retention-days: 30

  build-linux:
    needs: test
    runs-on: ubuntu-22.04        # oldest supported glibc
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build Linux binary
        run: PYTHON=python bash packaging/build_linux.sh --skip-tests
      - name: Self-test the frozen binary (GUI must be bundled)
        run: dist/linux/PortableSecurityAudit/PortableSecurityAudit selftest --require-gui
      - name: Archive with permissions preserved
        run: tar -C dist/linux -czf PortableSecurityAudit-linux.tar.gz PortableSecurityAudit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PortableSecurityAudit-linux
          path: PortableSecurityAudit-linux.tar.gz
          retention-days: 30

  usb-image:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: PortableSecurityAudit-windows
          path: builds/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: PortableSecurityAudit-linux
          path: builds
      - name: Assemble the drive layout
        run: |
          tar -C builds -xzf builds/PortableSecurityAudit-linux.tar.gz
          python scripts/prepare_usb.py usb/PortableSecurityAudit \
            --windows-build builds/windows --linux-build builds/PortableSecurityAudit | tee usb-manifest.txt
          bash usb/PortableSecurityAudit/PortableSecurityAudit.sh verify
          bash usb/PortableSecurityAudit/PortableSecurityAudit.sh audit --demo --operator CI --reference CI \
            --confirm "I AM AUTHORIZED" --output "$RUNNER_TEMP" > /dev/null
          tar -C usb -czf PortableSecurityAudit-usb.tar.gz PortableSecurityAudit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: PortableSecurityAudit-usb
          path: |
            PortableSecurityAudit-usb.tar.gz
            usb-manifest.txt
          retention-days: 30
