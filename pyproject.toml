[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "psatoolkit"
dynamic = ["version"]
description = "Portable, read-only security audit toolkit for authorized IT assessments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Runtime uses the Python standard library only (Tkinter is optional).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
PortableSecurityAudit = "psatoolkit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "psatoolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
